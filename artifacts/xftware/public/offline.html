<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Offline</title>
  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F8FAFC;
      margin: 0
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
      padding: 24px;
      max-width: 420px;
      text-align: center
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px
    }

    p {
      margin: 4px 0;
      color: #64748B
    }

    .btn {
      margin-top: 14px;
      display: inline-block;
      padding: 10px 16px;
      border-radius: 12px;
      background: #6366F1;
      color: #fff;
      text-decoration: none
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Anda Sedang Offline</h1>
    <p>Beberapa fitur tetap bisa dipakai. Coba lagi saat tersambung.</p>
    <a class="btn" href="/">Kembali ke Beranda</a>
  </div>
</body>

</html>
